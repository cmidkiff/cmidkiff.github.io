<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/resume.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to résumé</a>
    <div class="page-shell">
      <nav class="site-nav" aria-label="Site navigation">
        <a class="site-name" href="{{ '/' | relative_url }}">Caden Midkiff</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <span aria-current="page">Résumé</span>
      </nav>
      <main id="main">
        {{ content }}
      </main>
      <footer class="page-footer">
        <a href="{{ '/' | relative_url }}">Back to home</a>
        <span>Use your browser’s Print command to save a PDF.</span>
      </footer>
    </div>
  </body>
</html>
